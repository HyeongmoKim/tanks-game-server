apiVersion: apps/v1
kind: Deployment
metadata:
  name: tanks-server
  namespace: tanks
spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: tanks-server

  template:
    metadata:
      labels:
        app.kubernetes.io/name: tanks-server

    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: tanks-server
          image: 471507663179.dkr.ecr.ap-northeast-2.amazonaws.com/tanks-server-dev:e9284d14356faab14081bd9549894f934f019124
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: game
              containerPort: 7777
              protocol: TCP

          env:
            - name: TANKS_DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: tanks-db
                  key: TANKS_DB_CONNECTION_STRING

          startupProbe:
            tcpSocket:
              port: game
            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: game
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: game
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tanks-server
  namespace: tanks
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: TCP
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb

  selector:
    app.kubernetes.io/name: tanks-server

  ports:
    - name: game
      port: 7777
      targetPort: game
      protocol: TCP